<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC3D Server Viewer</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            font-family: Arial, sans-serif;
        }

        /* ALTERAÇÃO AQUI: Começa visível (display: block) */
        model-viewer {
            width: 100%;
            height: 100%;
            outline: none;
            display: block; 
        }

        #mensagem-erro {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            display: none; /* Escondido por defeito */
        }
    </style>
</head>
<body>

    <div id="mensagem-erro">
        <h2>Serviço Indisponível</h2>
        <p>O modelo 3D não foi encontrado ou o serviço foi suspenso.</p>
    </div>

    <!-- VISUALIZADOR COM UMA COR DE FUNDO TEMPORÁRIA -->
    <!-- (Adicionada uma cor cinzenta #eee para veres que o motor está a funcionar) -->
    <model-viewer 
        id="leitor-3d" 
        src="" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1.5" 
        auto-rotate
        style="background-color: #eeeeee;">
    </model-viewer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nomeDoFicheiro = urlParams.get('modelo');
        const leitor = document.getElementById('leitor-3d');
        const erro = document.getElementById('mensagem-erro');

        if (nomeDoFicheiro) {
            
            leitor.src = nomeDoFicheiro;
            
            // Se der erro ao carregar (ex: apagas o ficheiro), esconde o leitor e mostra o erro
            leitor.addEventListener('error', () => {
                leitor.style.display = 'none';
                erro.style.display = 'flex';
            });

            // Apaguei a condição 'load' que estava a encravar o ecrã. O leitor trata de si mesmo agora.

        } else {
            // Se o link vier sem "?modelo=", bloqueia logo.
            leitor.style.display = 'none';
            erro.style.display = 'flex';
        }
    </script>
</body>
</html>
